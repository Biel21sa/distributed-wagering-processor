services:
  postgres:
    image: postgres:17-alpine
    container_name: wagering-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: wagering
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:latest
    container_name: wagering-localstack
    restart: unless-stopped

    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN}
      DEBUG: 0

    ports:
      - "4566:4566"

    volumes:
      - localstack_data:/var/lib/localstack
      - ./docker/localstack/init/ready.d:/etc/localstack/init/ready.d
      - "/var/run/docker.sock:/var/run/docker.sock"

    healthcheck:
      test:
        [
          "CMD",
          "awslocal",
          "sqs",
          "list-queues"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  localstack_data: